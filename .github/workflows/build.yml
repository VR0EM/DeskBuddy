name: Build

# Builds the macOS and Windows installers on every push.
# Download them from the run's "Artifacts" section.
# Pushing a tag like v1.0.0 also publishes them as a GitHub release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            # One app for both Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install the Tauri CLI
        run: npm ci

      - name: Test the input listener
        working-directory: src-tauri
        run: cargo test -p deskbuddy-input

      - name: Build DeskBuddy
        run: npx tauri build ${{ matrix.args }}

      - name: Upload the installers
        uses: actions/upload-artifact@v7
        with:
          name: DeskBuddy-${{ matrix.name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish them as a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: DeskBuddy ${{ github.ref_name }}
          draft: false
          body: |
            **Download**
            - Mac (Apple Silicon and Intel): `DeskBuddy_..._universal.dmg`
            - Windows: `DeskBuddy_..._x64-setup.exe` (or the `.msi`)

            The app isn't signed with a paid certificate, so the first start needs one extra step:
            - Mac: System Settings > Privacy & Security > Open Anyway, then turn DeskBuddy on under Input Monitoring.
            - Windows: "Windows protected your PC" > More info > Run anyway.
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Start the app for a moment on a real Mac / Windows machine. This
      # doesn't block the build; the log and screenshots show how it went.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bash .github/smoke/macos.sh

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./.github/smoke/windows.ps1

      - name: Upload the smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore
